name: Deploy to EasyPanel

# Dispara o webhook do serviço api-c2 no EasyPanel após push em master.
# Pré-requisito: GitHub Secret `EASYPANEL_DEPLOY_WEBHOOK_C2` configurado.

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.vscode/**'
  workflow_dispatch: {}

concurrency:
  group: deploy-easypanel-c2
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger EasyPanel webhook
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate secret
        run: |
          if [ -z "${{ secrets.EASYPANEL_DEPLOY_WEBHOOK_C2 }}" ]; then
            echo "::error::Secret EASYPANEL_DEPLOY_WEBHOOK_C2 não configurado."
            exit 1
          fi

      - name: POST webhook
        env:
          WEBHOOK: ${{ secrets.EASYPANEL_DEPLOY_WEBHOOK_C2 }}
        run: |
          set -euo pipefail
          echo "[deploy] disparando webhook EasyPanel (api-c2)..."
          HTTP_CODE=$(curl -fsS -o /tmp/resp.txt -w '%{http_code}' \
            -X POST \
            -H 'User-Agent: gha-api-c2-agendamento/1.0' \
            "$WEBHOOK")
          echo "[deploy] HTTP $HTTP_CODE"
          if [ -s /tmp/resp.txt ]; then
            echo "[deploy] resposta:"
            head -c 1000 /tmp/resp.txt
            echo ""
          fi
